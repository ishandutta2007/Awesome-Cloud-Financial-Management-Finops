ight="400" fill="url(#bgGrad)"/><rect width="1200" height="400" fill="url(#grid)"/><circle cx="200" cy="100" r="180" fill="url(#purpleGlow)" class="bg-circle-1" filter="url(#glow)"/><circle cx="1000" cy="300" r="220" fill="url(#cyanGlow)" class="bg-circle-2" filter="url(#glow)"/><g class="dynamic-chart" opacity=".25"><path fill="none" stroke="#10b981" stroke-dasharray="1000" stroke-dashoffset="0" stroke-width="4" d="M 50 320 Q 250 280, 450 330 T 850 250 T 1150 180" filter="url(#glow)"/><path fill="url(#emeraldGlow)" d="M 50 320 Q 250 280, 450 330 T 850 250 T 1150 180 L 1150 380 L 50 380 Z" opacity=".15"/><rect width="18" height="100" x="920" y="220" fill="#38bdf8" opacity=".6" rx="4"/><rect width="18" height="140" x="950" y="180" fill="#818cf8" opacity=".6" rx="4"/><rect width="18" height="180" x="980" y="140" fill="#c084fc" opacity=".6" rx="4"/><rect width="18" height="220" x="1010" y="100" fill="#f472b6" opacity=".6" rx="4"/></g><g transform="translate(60, 75)"><rect width="320" height="34" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".5" stroke-width="1.5" rx="17"/><circle cx="20" cy="17" r="6" fill="#10b981"/><text x="36" y="22" class="badge-text">CURATED FINOPS &amp; COST ECOSYSTEM</text></g><text x="60" y="175" class="title-text" font-size="44" letter-spacing="-.5">Awesome Cloud Financial Management</text><text x="60" y="230" fill="#38bdf8" class="title-text" font-size="40" letter-spacing="-.5">&amp; FinOps Tools 💰📊</text><text x="60" y="285" class="subtitle-text" font-size="20">Commercial Platforms • Open-Source Tools • Cost Allocation • Unit Economics</text><g transform="translate(60, 320)"><rect width="140" height="28" x="0" y="0" fill="#334155" opacity=".8" rx="6"/><text x="70" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">☁️ Multi-Cloud</text><rect width="150" height="28" x="150" y="0" fill="#334155" opacity=".8" rx="6"/><text x="225" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">☸️ Kubernetes Costs</text><rect width="160" height="28" x="310" y="0" fill="#334155" opacity=".8" rx="6"/><text x="390" y="18" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">📈 Savings Plans &amp; RIs</text></g></svg>